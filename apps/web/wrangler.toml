# Cloudflare Pages project (Direct Upload via GitHub Actions, see .github/workflows/deploy.yml).
name = "streetwise"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
# Cloudflare Access (Zero Trust) protecting /api/*; see docs/SETUP.md.
# Team domain, e.g. "myteam.cloudflareaccess.com", and the application's AUD tag.
ACCESS_TEAM_DOMAIN = "noisy-recipe-2a1e.cloudflareaccess.com"
ACCESS_AUD = "1a4cde40a9904d147c53f35f341e5db89b040fa7517f377eadbc8db53f1bcde4"

# Synced progress (M4). Migrations: apps/web/migrations, applied by the deploy workflow.
[[d1_databases]]
binding = "DB"
database_name = "streetwise"
database_id = "a182a8ff-5498-43cb-bf40-b6c3810427a4"
migrations_dir = "migrations"
