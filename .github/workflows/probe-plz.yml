name: Probe postcodes (temporary)
on:
  push:
    paths: [".github/workflows/probe-plz.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install shapely==2.* requests
      - name: Postcode boundaries vs. city area
        shell: python
        run: |
          import json, time, requests
          from shapely.geometry import Polygon, MultiPolygon, LineString, shape
          from shapely.ops import unary_union, linemerge, polygonize
          EP = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]
          def q(query):
              for r in range(4):
                  for u in EP:
                      try:
                          res = requests.post(u, data={"data": query}, timeout=300, headers={"User-Agent": "streetwise-probe"})
                          if res.ok and res.json().get("elements"):
                              print("  via", u, "osm", res.json().get("osm3s", {}).get("timestamp_osm_base"))
                              return res.json()
                          print("  fail", u, res.status_code)
                      except Exception as e:
                          print("  err", u, e)
                  time.sleep(20 * (r + 1))
              raise SystemExit("overpass failed")
          def rel_poly(rel):
              lines = [LineString([(p["lon"], p["lat"]) for p in m["geometry"]]) for m in rel["members"] if m["type"] == "way" and m.get("geometry") and m["role"] in ("outer", "")]
              polys = list(polygonize(unary_union(lines)))
              return unary_union(polys) if polys else None
          area = '["boundary"="administrative"]["admin_level"="8"]["name"="Aachen"]'
          city = q(f'[out:json][timeout:300];relation{area};out geom;')
          cityp = rel_poly(city["elements"][0])
          print("city area (deg²):", round(cityp.area, 6))
          plz = q(f'[out:json][timeout:300];area{area}->.c;relation(area.c)["boundary"="postal_code"];out geom;')
          polys = {}
          for r in plz["elements"]:
              code = r.get("tags", {}).get("postal_code")
              p = rel_poly(r)
              if code and p is not None:
                  polys[code] = p
          inter = {c: p.intersection(cityp).area / cityp.area for c, p in polys.items()}
          inside = {c: v for c, v in inter.items() if v > 0.001}
          print("postcode relations:", len(polys), "| overlapping the city:", len(inside))
          for c in sorted(inside):
              print(f"  {c}: {inside[c]*100:5.1f}% of city, note={next((r['tags'].get('note','') for r in plz['elements'] if r['tags'].get('postal_code')==c), '')[:60]}")
          union = unary_union([polys[c] for c in inside]).intersection(cityp)
          print("coverage of city area: %.2f%%" % (100 * union.area / cityp.area))
          overl = sum(polys[c].intersection(cityp).area for c in inside) - union.area
          print("overlap between areas: %.3f%% of city" % (100 * overl / cityp.area))
          # addr:postcode sample for comparison
          addr = q(f'[out:json][timeout:300];area{area}->.c;(node(area.c)["addr:postcode"];way(area.c)["addr:postcode"];);out tags center 20000;')
          from collections import Counter
          cnt = Counter(e["tags"]["addr:postcode"] for e in addr["elements"])
          print("addr:postcode values (top 25):", cnt.most_common(25))
          # consistency: share of addresses whose point lies in the polygon of its postcode
          from shapely.geometry import Point
          ok = tot = 0
          for e in addr["elements"]:
              c = e["tags"]["addr:postcode"]
              pt = (e.get("lon"), e.get("lat")) if "lon" in e else (e.get("center", {}).get("lon"), e.get("center", {}).get("lat"))
              if c in polys and pt[0]:
                  tot += 1
                  ok += polys[c].buffer(0.0003).contains(Point(pt))
          print(f"addresses consistent with polygons: {ok}/{tot} = {100*ok/max(tot,1):.1f}%")
