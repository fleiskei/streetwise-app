name: Probe NRW DOP (temporary)
on:
  push:
    paths: [".github/workflows/probe-dop.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sample tiles (Aachen Dom), matrix = zoom - 5
        run: |
          B=https://www.wmts.nrw.de/geobasis/wmts_nw_dop/tiles/nw_dop/EPSG_3857_16
          for t in "11/33875/22004" "09/8468/5501" "13/135502/88019" "15/542008/352076"; do
            curl -sS -o /dev/null -H "Origin: https://claude-street-names-training.streetwise.pages.dev" -D h.txt -w "$t -> %{http_code} %{content_type} %{size_download}B\n" "$B/$t"
            grep -i "access-control-allow-origin" h.txt || echo "  (no ACAO)"
          done
