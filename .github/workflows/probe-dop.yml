name: Probe NRW DOP (temporary)
on:
  push:
    paths: [".github/workflows/probe-dop.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capabilities
        run: |
          for s in wmts_nw_dop wmts_nw_dop40 wmts_nw_dop_overlay; do
            echo "=== $s"
            curl -sS -m 60 "https://www.wmts.nrw.de/geobasis/$s/1.0.0/WMTSCapabilities.xml" -o cap_$s.xml -w "HTTP %{http_code} %{size_download}B\n" || true
            grep -oE "<ows:Identifier>[^<]*</ows:Identifier>" cap_$s.xml | sort -u | head -40
            grep -oE "<ResourceURL[^>]*>" cap_$s.xml | head -5
            grep -oE "<ows:(Fees|AccessConstraints)>[^<]*" cap_$s.xml | head -4
            grep -oE "<Format>[^<]*" cap_$s.xml | sort -u
          done
      - name: Sample tile + CORS
        run: |
          # Aachen Dom at z16 in WebMercator: x=33871 y=22006 (approx)
          for s in wmts_nw_dop; do
            url=$(grep -oE 'template="[^"]*"' cap_$s.xml | head -1 | sed 's/template="//;s/"$//')
            echo "template: $url"
          done
          curl -sS -I -H "Origin: https://streetwise.pages.dev" "https://www.wmts.nrw.de/geobasis/wmts_nw_dop/tiles/nw_dop/EPSG_3857_16/16/33871/22006.jpeg" | head -20 || true
