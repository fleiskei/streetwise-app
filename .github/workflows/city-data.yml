name: Build city data

# Regenerates street data (Overpass) and base-map tiles (Protomaps) and commits them
# to the branch. Runs manually from the Actions tab (once this file is on the default
# branch) and on every push that changes a city config, the data pipeline or this
# workflow. On push, tiles are only built when missing.
on:
  push:
    paths:
      - "cities/**"
      - "tools/data/src/**"
      - ".github/workflows/city-data.yml"
  workflow_dispatch:
    inputs:
      city:
        description: City id (cities/<id>.json)
        default: aachen
      tiles:
        description: Also (re)build the base-map tiles
        type: boolean
        default: true

concurrency:
  group: city-data-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Street data
        run: pnpm --filter @streetwise/data build-city "${{ inputs.city || 'aachen' }}" --refresh
      - name: Tiles
        if: inputs.tiles || (github.event_name == 'push' && hashFiles('apps/web/public/tiles/aachen/tiles.json') == '')
        run: pnpm --filter @streetwise/tiles build-tiles "${{ inputs.city || 'aachen' }}" --force
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data apps/web/public/tiles
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: rebuild ${{ inputs.city || 'aachen' }} from OpenStreetMap"
          git push
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy the new data here.
      - name: Build app
        run: pnpm build
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=streetwise --branch="${GITHUB_REF_NAME}" --commit-dirty=true
