name: Build city data

# Regenerates street data (Overpass) and base-map tiles (Protomaps) and commits them
# to the branch. Runs manually from the Actions tab (once this file is on the default
# branch) and on every push that changes a city config or this workflow.
on:
  push:
    paths:
      - "cities/**"
      - ".github/workflows/city-data.yml"
  workflow_dispatch:
    inputs:
      city:
        description: City id (cities/<id>.json)
        default: aachen
      tiles:
        description: Also (re)build the base-map tiles
        type: boolean
        default: true

concurrency:
  group: city-data-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Street data
        run: pnpm --filter @streetwise/data build-city "${{ inputs.city || 'aachen' }}" --refresh
      - name: Tiles
        if: github.event_name == 'push' || inputs.tiles
        run: pnpm --filter @streetwise/tiles build-tiles "${{ inputs.city || 'aachen' }}" --force
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data apps/web/public/tiles
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: rebuild ${{ inputs.city || 'aachen' }} from OpenStreetMap"
          git push
